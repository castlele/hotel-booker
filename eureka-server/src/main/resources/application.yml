server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    enable-self-preservation: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:dev-secret-please-change-32-chars-min}
    ttl-seconds: 3600
